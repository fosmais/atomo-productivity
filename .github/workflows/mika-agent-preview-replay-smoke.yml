name: MYRYRA MIKA Agent preview replay smoke
on:
  pull_request:
    paths:
      - 'docs/sql/myryra-mika-agent-*.sql'
      - 'docs/sql/myryra-core-*-candidate.sql'
      - 'supabase/migrations/20261109120000_mika_execution_approved_plan_compat.sql'
      - '.github/workflows/mika-agent-preview-replay-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: testdb
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f docs/sql/myryra-mika-agent-preview-replay-smoke.sql
