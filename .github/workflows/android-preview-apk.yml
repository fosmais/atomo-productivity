name: MYRYRA Android preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: feat/myryra-mvp1-billing-foundation
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require isolated homologation configuration
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.MYRYRA_HOMOLOG_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MYRYRA_HOMOLOG_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_MYRYRA_API_URL: ${{ vars.MYRYRA_HOMOLOG_API_URL }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::EXPO_TOKEN ausente"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "::error::Supabase de homologação ausente"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "::error::Chave de homologação ausente"; exit 1; }
          test -n "$EXPO_PUBLIC_MYRYRA_API_URL" || { echo "::error::API de homologação ausente"; exit 1; }
          case "$EXPO_PUBLIC_SUPABASE_URL" in
            https://vzgahbceixjrdlqdtwoy.supabase.co) ;;
            *) echo "::error::Somente o projeto Supabase isolado de homologação é permitido"; exit 1 ;;
          esac
          case "$EXPO_PUBLIC_MYRYRA_API_URL" in
            https://*) ;;
            *) echo "::error::API deve usar HTTPS"; exit 1 ;;
          esac
          case "$EXPO_PUBLIC_MYRYRA_API_URL" in
            *myryra.com*|*atomo-productivity.com*|*vercel.app*) echo "::error::Utilize uma API de homologação isolada, sem alias público de produção/preview"; exit 1 ;;
          esac
      - name: Link configured EAS project for this CI run
        env:
          EXPO_PROJECT_ID: ${{ vars.MYRYRA_EXPO_PROJECT_ID }}
        run: |
          test -n "$EXPO_PROJECT_ID" || { echo "::error::Configure MYRYRA_EXPO_PROJECT_ID"; exit 1; }
          node -e 'const fs=require("fs");const id=process.env.EXPO_PROJECT_ID;if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)){process.exit(1)}const path="app.json";const config=JSON.parse(fs.readFileSync(path,"utf8"));config.expo.extra={...(config.expo.extra||{}),eas:{projectId:id}};fs.writeFileSync(path,JSON.stringify(config,null,2)+"\\n");'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify Expo SDK dependency compatibility
        run: npx expo install --check
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Validate Android bundle before cloud build
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.MYRYRA_HOMOLOG_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MYRYRA_HOMOLOG_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_MYRYRA_API_URL: ${{ vars.MYRYRA_HOMOLOG_API_URL }}
        run: npx expo export --platform android --output-dir dist-android
      - name: Setup EAS CLI
        run: npm install --global eas-cli
      - name: Confirm EAS project linkage
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ vars.MYRYRA_EXPO_PROJECT_ID }}
        run: |
          test -n "$EXPO_PROJECT_ID" || { echo "::error::Configure MYRYRA_EXPO_PROJECT_ID com o ID do projeto EAS"; exit 1; }
          node -e 'const id=process.env.EXPO_PROJECT_ID;if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id))process.exit(1)' || { echo "::error::ID do projeto EAS inválido"; exit 1; }
          eas project:info --non-interactive
      - name: Request internal APK build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.MYRYRA_HOMOLOG_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MYRYRA_HOMOLOG_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_MYRYRA_API_URL: ${{ vars.MYRYRA_HOMOLOG_API_URL }}
        run: eas build --platform android --profile preview --non-interactive --no-wait
