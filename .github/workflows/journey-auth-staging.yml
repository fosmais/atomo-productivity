name: Journey Auth isolation (staging only)
on:
  push:
    branches:
      - feat/mvp2-professora-journey-myra-26
  workflow_dispatch:
    inputs:
      bootstrap_synthetic_accounts:
        description: 'Bootstrap two synthetic staging identities only'
        required: false
        type: boolean
        default: false
      run_mika_concurrency:
        description: 'Run MIKA concurrency tests (not used by this bootstrap workflow)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  auth-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      MIKA_STAGING_ANON_KEY: ${{ secrets.MIKA_STAGING_ANON_KEY }}
      MIKA_TEST_EMAIL: ${{ secrets.MIKA_TEST_EMAIL }}
      MIKA_TEST_PASSWORD: ${{ secrets.MIKA_TEST_PASSWORD }}
      MIKA_TEST_OTHER_EMAIL: ${{ secrets.MIKA_TEST_OTHER_EMAIL }}
      MIKA_TEST_OTHER_PASSWORD: ${{ secrets.MIKA_TEST_OTHER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Push runs test the exact homologation branch; manual runs stay pinned to the reviewed test commit.
          ref: ${{ github.event_name == 'push' && github.ref || '92ae3dab0021d9b231d4791e839a12666c458544' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require staging credentials
        shell: bash
        run: |
          for key in MIKA_STAGING_ANON_KEY MIKA_TEST_EMAIL MIKA_TEST_PASSWORD MIKA_TEST_OTHER_EMAIL MIKA_TEST_OTHER_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing staging secret: $key"
              exit 1
            fi
          done
      - run: npm ci --ignore-scripts
      - name: Bootstrap two synthetic staging identities only
        if: github.event_name == 'push' || (inputs.bootstrap_synthetic_accounts == true && inputs.run_mika_concurrency != true)
        run: node scripts/mika-two-users-staging.cjs
      - name: Verify two real staging Auth sessions and Journey isolation
        if: github.event_name == 'push' || inputs.bootstrap_synthetic_accounts != true
        run: node scripts/journey-auth-isolation-staging.cjs
      - name: Reject unsupported combined bootstrap and concurrency request
        if: github.event_name != 'push' && inputs.bootstrap_synthetic_accounts == true && inputs.run_mika_concurrency == true
        run: |
          echo '::error::Bootstrap and concurrency must run as separate reviewed operations.'
          exit 1
