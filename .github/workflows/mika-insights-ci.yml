name: MIKA Insights quality checks

on:
  pull_request:
    paths:
      - 'src/app/mika-insights/**'
      - 'src/app/api/mika-insights/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mika-insights-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ESLint (MIKA Insights)
        run: npx eslint src/app/mika-insights src/app/api/mika-insights
      - name: TypeScript
        run: npx tsc --noEmit
