name: MYRYRA regression checks

on:
  push:
    branches:
      - feat/myryra-mvp1-billing-foundation
  pull_request:

jobs:
  myka-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Lint MYRYRA Finance wallet
        run: npx eslint src/app/dashboard/myryra-finance-starter.tsx
