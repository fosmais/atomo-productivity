name: MVP3 regression
on:
  workflow_dispatch:
  push:
    branches:
      - feat/myryra-mvp3-agent-foundation
permissions:
  contents: read
concurrency:
  group: mvp3-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
