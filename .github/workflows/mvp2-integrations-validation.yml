name: MVP2 Integrations Validation
on:
  push:
    branches:
      - feat/myryra-mvp1-billing-foundation
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - name: Lint integration changes
        run: npx eslint src/app/api/microsoft src/lib/microsoft-token-crypto.ts src/app/dashboard/microsoft-calendar-preview.tsx src/app/dashboard/external-integrations.tsx
      - name: Full repository lint (legacy debt; non-blocking)
        continue-on-error: true
        run: npm run lint
