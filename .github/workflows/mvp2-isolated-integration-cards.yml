name: MVP2 isolated integration cards checks
on:
  pull_request:
    paths:
      - 'src/app/dashboard/integration-status-cards.tsx'
      - 'src/app/dashboard/page.tsx'
      - 'tests/integration-cards-release.test.cjs'
      - '.github/workflows/mvp2-isolated-integration-cards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Check isolated cards safety contract
        run: node --test tests/integration-cards-release.test.cjs
